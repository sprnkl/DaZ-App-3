<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DaZ PROGRAMM – Übersicht</title>

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Eigenes CSS -->
    <link href="style.css" rel="stylesheet">

    <style>
        .rtl { direction: rtl; text-align: right; }
        .ltr { direction: ltr; text-align: left; }

        .audio-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 0;
            margin-left: 0.5rem;
        }
    </style>
</head>

<body class="p-8 bg-gray-100">

    <div class="max-w-2xl mx-auto bg-white shadow-2xl rounded-xl p-8">

        <h1 class="text-4xl font-extrabold text-blue-800 mb-4">
            DaZ Programm – GOBS Lindern
        </h1>

        <p class="text-lg text-gray-700 mb-6 border-b pb-3">
            Wählen Sie eine Lektion. Titel und Vorlesen passen sich der Sprache an.
        </p>

        <!-- Sprachauswahl -->
        <div class="mb-6 flex flex-wrap gap-2 items-center p-3 bg-gray-50 rounded-lg">
            <span class="text-sm font-semibold text-gray-700 mr-2">
                Sprache:
            </span>

            <button data-lang="DE" class="lang-btn px-3 py-1 rounded-full text-sm">DE</button>
            <button data-lang="AR" class="lang-btn px-3 py-1 rounded-full text-sm">AR</button>
            <button data-lang="RU" class="lang-btn px-3 py-1 rounded-full text-sm">RU</button>
            <button data-lang="FA" class="lang-btn px-3 py-1 rounded-full text-sm">FA</button>
            <button data-lang="RO" class="lang-btn px-3 py-1 rounded-full text-sm">RO</button>
        </div>

        <!-- HIER baut JavaScript die Lektionen -->
        <div id="lesson-list-container">
            <p class="text-gray-500 text-center p-10">
                Lektionen werden geladen …
            </p>
        </div>

    </div>

    <!-- WICHTIG: NUR DAS INDEX-SCRIPT -->
    <script src="js/index.js"></script>

</body>
</html>
